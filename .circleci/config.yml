version: 2.1
orbs:
  git-shallow-clone: guitarrapc/git-shallow-clone@2.8.0

efcms-docker-image: &efcms-docker-image $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ef-cms-us-east-1:4.3.76

parameters:
  run_build_and_deploy:
    default: true
    type: boolean

  run_build_and_deploy_to_prod:
    default: true
    type: boolean

  run_glue_to_test:
    default: false
    type: boolean

  run_s3_to_test:
    default: false
    type: boolean

  run_glue_to_lower_env:
    default: false
    type: boolean

  run_reindex_opensearch:
    default: false
    type: boolean

  run_sync_s3_to_lower_env:
    default: false
    type: boolean

  run_real_user_tests:
    default: false
    type: boolean

  lower_env:
    default: test
    type: string

  lower_env_account_id:
    default: ''
    type: string

  referrer:
    default: ''
    type: string

  source_bucket:
    default: ''
    type: string

  destination_bucket:
    default: ''
    type: string

  force_all_migrations:
    default: false
    type: boolean

commands:
  npm-and-cypress-install:
    steps:
      - restore_cache:
          keys:
            - v27-npm-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
      - restore_cache:
          keys:
            - v27-cypress-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
      - run:
          name: Install node dependencies
          command: |
            if [ ! -d node_modules ]; then
              npm ci
            else
              echo package.json and package-lock.json are unchanged. Using cached node_modules folder.
            fi
      - run:
          name: Install Cypress dependency
          command: |
            if [ ! -d ~/.cache/Cypress ]; then
              echo Installing Cypress
              ./node_modules/.bin/cypress install
            else
              echo Found cached Cypress version. Using cached Cypress folder.
            fi
      - run:
          name: Reset package-lock
          command: 'git checkout -- package-lock.json'
      - save_cache:
          key: v27-npm-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - save_cache:
          key: v27-cypress-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/Cypress

  npm-install:
    steps:
      - restore_cache:
          keys:
            - v27-npm-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
      - run:
          name: Install node dependencies
          command: |
            if [ ! -d node_modules ]; then
              npm ci
            else
              echo package.json and package-lock.json are unchanged. Using cached node_modules folder.
            fi
      - run:
          name: Reset package-lock
          command: 'git checkout -- package-lock.json'
      - save_cache:
          key: v27-npm-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

jobs:
  deploy:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: xlarge
    steps:
      - setup_remote_docker:
          version: docker29
          docker_layer_caching: true
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Build Docker Image
          command: |
            cd web-api/runtimes/puppeteer && ./build.sh && cd ../../..
      - run:
          name: Perform an Aurora blue/green deployment if the RDS engine version has changed
          command: |
            CURRENT_RDS_ENGINE_VERSION=$(aws rds describe-db-clusters --db-cluster-identifier "${ENV}-dawson-cluster" --query "DBClusters[0].EngineVersion" --region "$REGION" --output text)
            if [ -n "$CURRENT_RDS_ENGINE_VERSION" ] && [ "$CURRENT_RDS_ENGINE_VERSION" != "$RDS_ENGINE_VERSION" ]; then
              ./scripts/postgres/upgrade-rds-engine-version.sh
            else
              echo "skipping…"
            fi
      - run:
          no_output_timeout: 20m
          name: 'Deploy - All Color Terraform'
          command: |
            npm run deploy:allColors $ENV
      - run:
          no_output_timeout: 20m
          name: 'Deploy - Color Terraform'
          command: |
            if [ "${DEPLOYING_COLOR}" == "blue" ]; then
              npm run deploy:blue $ENV
            else
              npm run deploy:green $ENV
            fi
      - run:
          name: Setup Elasticsearch Index Settings
          command: |
            ./web-api/setup-elasticsearch-index.sh $ENV
      - run:
          name: Test Users Setup
          command: |
            if [ "${CIRCLE_BRANCH}" != "prod" ]; then
              ./scripts/user/setup-test-users.ts
            else
              echo "skipping…"
            fi
      - run:
          name: Users Setup
          command: |
            if [ "${CIRCLE_BRANCH}" == "prod" ]; then
              echo "skipping…"
              exit 0
            fi
            if [ "${CIRCLE_BRANCH}" != "test" ]; then
              npx ts-node --transpile-only ./scripts/circleci/judge/bulkImportJudgeUsers.ts | tee bulk-import-log.txt
            fi
      - run:
          name: 'Deploy - Web Client - S3'
          command: |
            ./web-client/deploy-ui.sh
      - run:
          name: 'Deploy - Public Web Client - S3'
          command: |
            ./web-client/deploy-public.sh
      - run:
          name: 'Deploy - Inactive Cases Email Lambda and Monthly Cron Trigger'
          command: |
            if [ -n "$INACTIVITY_REPORT_RECIPIENTS" ]; then
              ES_DOMAIN="$SOURCE_ELASTICSEARCH"
              if [ "$MIGRATE_FLAG" == "true" ]; then
                ES_DOMAIN=$(./scripts/elasticsearch/get-destination-elasticsearch.sh "$ENV")
              fi
              ES_ENDPOINT=$(aws es describe-elasticsearch-domain \
                --domain-name "$ES_DOMAIN" \
                --region "$REGION" \
                --query 'DomainStatus.Endpoint' \
                --output text)
              export ELASTICSEARCH_ENDPOINT="$ES_ENDPOINT"
              npm run deploy:stale-cases-email-cron -- $ENV
            fi
      - run:
          name: 'Deploy - Authorizer Smoke Tests'
          command: |
            npm run verify-authorizers -- $ENV
      - run:
          name: 'Deploy - Verify Private Elasticsearch'
          command: |
            npm run verify-private-elasticsearch -- $ENV

  docker-image-zipper:
    docker:
      - image: cimg/node:24.15.0
    resource_class: xlarge
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Install AWS CLI
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
      - setup_remote_docker:
          version: docker29
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Deploy ECR Images
          command: |
            npm run deploy:zipper

  migrate:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: xlarge
    steps:
      - setup_remote_docker:
          version: docker29
          docker_layer_caching: true
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          no_output_timeout: 30m
          name: Run Postgres Migration
          command: |
            npm run migration:postgres
      - when:
          condition: << pipeline.parameters.force_all_migrations >>
          no_output_timeout: 30m
          steps:
            - run:
                name: Run Postgres Deprecated Migration
                command: npm run migration:postgres:deprecated
      - run:
          name: Restore Postgres User Permissions
          command: |
            cd ./scripts/postgres
            DB_HOST="$POSTGRES_HOST" ./create-rds-users.sh

  smoketests:
    parallelism: 9
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: large
    steps:
      - setup_remote_docker:
          version: docker29
          docker_layer_caching: true
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Create Cypress Artifacts Directory
          command: mkdir /tmp/cypress
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: 'Cypress Smoke Tests'
          command: find cypress/deployed-and-local/integration -type f -name "*.cy.ts" | circleci tests run --split-by=timings --command 'paste -sd, - | xargs -I {} ./scripts/run-cypress.sh -s -t {}'
      - store_artifacts:
          path: /root/project/cypress/deployed-and-local/videos/

  smoketests-readonly:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Create Cypress Artifacts Directory
          command: mkdir /tmp/cypress
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Create and Enable Test User
          command: ./scripts/user/create-and-enable-smoketest-user.ts
      - run:
          name: 'Cypress Readonly Smoke Tests'
          command: |
            set +e
            npm run cypress:readonly
            echo "export READONLY_SMOKETESTS_RESULT=$?" >> $BASH_ENV
            set -e
      - run:
          name: Disable Test User
          command: ./scripts/user/disable-smoketest-user.ts
      - run:
          name: Kill Build if Smoketests Failed
          command: |
            if [ "${READONLY_SMOKETESTS_RESULT}" -ne 0 ]; then
              exit 1
            fi
      - run:
          name: 'Cypress Public Readonly Smoke Tests'
          command: npm run cypress:readonly:public
      - store_artifacts:
          path: /root/project/cypress/readonly/videos/

  loadtests:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: 'Load tests'
          command: npm run loadtest:pdf-generation

  api-hosted-environment-tests:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: 'API Hosted Environment Tests'
          command: npm run test:api:hosted-environment

  deploy-switch-colors-cron:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    steps:
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Deploy Switch Colors Cron
          command: |
            npm run deploy:switch-colors-cron -- $ENV

  disable-switch-colors-cron:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    steps:
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Disable Switch Colors Cron
          command: |
            npm run destroy:switch-colors-cron -- $ENV

  switch-colors:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          no_output_timeout: 65m
          name: Wait for Change of Address SQS Queue to Drain
          command: |
            ./scripts/circleci/wait-for-empty-sqs-queue.sh
      - run:
          name: 'Switch Colors'
          command: npm run switch-colors

  cleanup:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Run Postgres Contract Migration
          command: npm run migration:postgres:contract
      - run:
          name: Setup Elasticsearch Aliases
          command: |
            npx ts-node --transpile-only ./web-api/elasticsearch/elasticsearch-alias-settings.ts
      - run:
          name: Delete Source Elasticsearch Indices After Reindex
          command: |
            ./web-api/delete-unaliased-elasticsearch-indices.sh $ENV
      - run:
          name: Delete Source ElasticSearch cluster
          command: |
            if [ $MIGRATE_FLAG == true ]; then
              npm run delete:elasticsearch-cluster -- $SOURCE_ELASTICSEARCH
            fi
      - run:
          name: Cleanup Deploy Table After Migration
          command: |
            if [ $MIGRATE_FLAG == true ]; then
              npm run migration:cleanup -- $ENV
            fi
      - run:
          name: Cleanup Cypress Test Accounts
          command: |
            npm run cleanup:cypress-test-accounts

  ######################## GLUE JOB: Jobs that run in a lower environment ########################

  delete-and-recreate-elasticsearch-cluster:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Setup SSM
          command: |
            ./scripts/circleci/setup-ssm-for-glue-job.sh
      - run:
          name: 'Delete OpenSearch alpha/beta clusters'
          command: |
            ./scripts/elasticsearch/delete-alpha-and-beta-clusters.sh
      - run:
          no_output_timeout: 20m
          name: 'Recreate the alpha OpenSearch cluster'
          command: |
            npm run deploy:allColors $ENV
      - run:
          name: Setup OpenSearch Index Settings and Mappings
          command: |
            ./web-api/setup-elasticsearch-index.sh $ENV
      - run:
          name: Setup OpenSearch Aliases
          command: |
            npx ts-node --transpile-only ./web-api/elasticsearch/elasticsearch-alias-settings.ts

  initiate-glue-job:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            source $BASH_ENV
            VCS=<< pipeline.project.type >>
            CIRCLE_PROJECT_SLUG="${VCS}/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            echo "export CIRCLE_PROJECT_SLUG=${CIRCLE_PROJECT_SLUG}" >> $BASH_ENV
            if [[ -z "$PROD_DOCUMENTS_BUCKET_NAME" ]]; then
              echo "Error: expected PROD_DOCUMENTS_BUCKET_NAME environment variable"
              exit 1
            fi
            echo "export SOURCE_BUCKET=${PROD_DOCUMENTS_BUCKET_NAME}" >> $BASH_ENV
            echo "export DESTINATION_BUCKET=${EFCMS_DOMAIN}-documents-${ENV}-${REGION}" >> $BASH_ENV
      - run:
          name: 'Delete Cognito users'
          command: |
            ./scripts/user/clear-all-cognito-users.ts
      - run:
          name: Kick off the sync-s3-to-lower-env workflow
          command: |
            curl --request POST \
              --url "https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline" \
              --header "Circle-Token: ${CIRCLE_MACHINE_USER_TOKEN}" \
              --header "content-type: application/json" \
              --data "{\"branch\":\"${CIRCLE_BRANCH}\", \"parameters\":{ \
                \"run_build_and_deploy\":false, \
                \"run_sync_s3_to_lower_env\":true, \
                \"referrer\":\"${CIRCLE_WORKFLOW_ID}\", \
                \"source_bucket\":\"${SOURCE_BUCKET}\", \
                \"destination_bucket\":\"${DESTINATION_BUCKET}\"}}"
      - run:
          name: Kick off the glue-to-lower-env workflow
          command: |
            CIRCLE_PIPELINE_ID=$(curl --request POST \
              --url "https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline" \
              --header "Circle-Token: ${CIRCLE_MACHINE_USER_TOKEN}" \
              --header "content-type: application/json" \
              --data "{\"branch\":\"prod\", \"parameters\":{ \
                \"run_build_and_deploy_to_prod\":false, \
                \"run_glue_to_lower_env\":true, \
                \"lower_env\":\"${ENV}\", \
                \"lower_env_account_id\":\"${AWS_ACCOUNT_ID}\"}}" | jq -r '.id')
            echo "export CIRCLE_PIPELINE_ID=${CIRCLE_PIPELINE_ID}" >> $BASH_ENV
      - run:
          name: Deploy Wait for Workflow Cron Lambda
          command: |
            export APPROVAL_JOB_NAME=wait-for-glue-workflow
            npm run deploy:wait-for-workflow-cron -- $ENV
      - run:
          name: Enable Wait for Workflow Cron
          command: |
            ./scripts/wait-for-workflow/enable-wait-for-workflow-cron.sh

  migrate-restored-postgres-data:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: Disable Wait for Workflow Cron
          command: |
            ./scripts/wait-for-workflow/disable-wait-for-workflow-cron.sh
      - run:
          name: Destroy Wait for Workflow Lambda
          command: |
            export APPROVAL_JOB_NAME=wait-for-glue-workflow
            export CIRCLE_PIPELINE_ID=noop
            npm run destroy:wait-for-workflow-cron -- $ENV
      - run:
          no_output_timeout: 30m
          name: Migrate Postgres Data Schema
          command: |
            npm run migration:postgres
            npm run migration:postgres:contract
      - run:
          name: Restore Postgres User Permissions
          command: |
            cd ./scripts/postgres
            DB_HOST="$POSTGRES_HOST" ./create-rds-users.sh

  index-cases:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            source $BASH_ENV
            DESTINATION_DOMAIN=$(./scripts/elasticsearch/get-destination-elasticsearch.sh "${ENV}")
            ELASTICSEARCH_ENDPOINT=$(aws es describe-elasticsearch-domain \
              --domain-name "${DESTINATION_DOMAIN}" \
              --region "$REGION" \
              --query 'DomainStatus.Endpoint' \
              --output text)
            echo "export ELASTICSEARCH_ENDPOINT=${ELASTICSEARCH_ENDPOINT}" >> $BASH_ENV
      - run:
          name: Index Cases
          command: |
            ./scripts/reindex/index-cases/index-cases.ts 5

  index-users:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            source $BASH_ENV
            DESTINATION_DOMAIN=$(./scripts/elasticsearch/get-destination-elasticsearch.sh "${ENV}")
            ELASTICSEARCH_ENDPOINT=$(aws es describe-elasticsearch-domain \
              --domain-name "${DESTINATION_DOMAIN}" \
              --region "$REGION" \
              --query 'DomainStatus.Endpoint' \
              --output text)
            echo "export ELASTICSEARCH_ENDPOINT=${ELASTICSEARCH_ENDPOINT}" >> $BASH_ENV
      - run:
          name: Index Users
          command: |
            ./scripts/reindex/index-users/index-users.ts 5

  index-docket-entries:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            source $BASH_ENV
            DESTINATION_DOMAIN=$(./scripts/elasticsearch/get-destination-elasticsearch.sh "${ENV}")
            ELASTICSEARCH_ENDPOINT=$(aws es describe-elasticsearch-domain \
              --domain-name "${DESTINATION_DOMAIN}" \
              --region "$REGION" \
              --query 'DomainStatus.Endpoint' \
              --output text)
            echo "export ELASTICSEARCH_ENDPOINT=${ELASTICSEARCH_ENDPOINT}" >> $BASH_ENV
      - run:
          name: Index Docket Entries
          command: |
            ./scripts/reindex/index-docket-entries/index-docket-entries.ts 5

  cleanup-glue-job:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            VCS=<< pipeline.project.type >>
            CIRCLE_PROJECT_SLUG="${VCS}/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            echo "export CIRCLE_PROJECT_SLUG=${CIRCLE_PROJECT_SLUG}" >> $BASH_ENV
      - run:
          name: Cleanup Deploy Table
          command: |
            npm run migration:cleanup -- $ENV
      - run:
          name: Populate test users in Cognito
          command: |
            ./scripts/user/setup-glued-users.ts
      - run:
          name: Kick off a deployment
          command: |
            CIRCLE_PIPELINE_ID=$(curl --request POST \
              --url "https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline" \
              --header "Circle-Token: ${CIRCLE_MACHINE_USER_TOKEN}" \
              --header "content-type: application/json" \
              --data "{\"branch\":\"${CIRCLE_BRANCH}\"}" | jq -r '.id')

  sync-s3-buckets-with-timeout:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: xlarge
    environment:
      REFERRER: << pipeline.parameters.referrer >>
      SOURCE_BUCKET: << pipeline.parameters.source_bucket >>
      DESTINATION_BUCKET: << pipeline.parameters.destination_bucket >>
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            VCS=<< pipeline.project.type >>
            CIRCLE_PROJECT_SLUG="${VCS}/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            echo "export CIRCLE_PROJECT_SLUG=${CIRCLE_PROJECT_SLUG}" >> $BASH_ENV
            if [[ -z "$REFERRER" ]]; then
              echo "Error: no referrer was provided"
              exit 1
            fi
            if [[ -z "$SOURCE_BUCKET" ]]; then
              echo "Error: no source bucket was provided"
              exit 1
            fi
            if [[ -z "$DESTINATION_BUCKET" ]]; then
              echo "Error: no destination bucket was provided"
              exit 1
            fi
      - run:
          no_output_timeout: 175m
          name: Sync S3 buckets with timeout
          command: |
            ./scripts/circleci/sync-s3-buckets-with-timeout.sh 175m

  initiate-s3-sync:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            source $BASH_ENV
            VCS=<< pipeline.project.type >>
            CIRCLE_PROJECT_SLUG="${VCS}/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            echo "export CIRCLE_PROJECT_SLUG=${CIRCLE_PROJECT_SLUG}" >> $BASH_ENV
            if [[ -z "$PROD_DOCUMENTS_BUCKET_NAME" ]]; then
              echo "Error: expected PROD_DOCUMENTS_BUCKET_NAME environment variable"
              exit 1
            fi
            echo "export SOURCE_BUCKET=${PROD_DOCUMENTS_BUCKET_NAME}" >> $BASH_ENV
            echo "export DESTINATION_BUCKET=${EFCMS_DOMAIN}-documents-${ENV}-${REGION}" >> $BASH_ENV
      - run:
          name: Kick off the sync-s3-to-lower-env workflow
          command: |
            curl --request POST \
              --url "https://circleci.com/api/v2/project/${CIRCLE_PROJECT_SLUG}/pipeline" \
              --header "Circle-Token: ${CIRCLE_MACHINE_USER_TOKEN}" \
              --header "content-type: application/json" \
              --data "{\"branch\":\"${CIRCLE_BRANCH}\", \"parameters\":{ \
                \"run_build_and_deploy\":false, \
                \"run_sync_s3_to_lower_env\":true, \
                \"referrer\":\"${CIRCLE_WORKFLOW_ID}\", \
                \"source_bucket\":\"${SOURCE_BUCKET}\", \
                \"destination_bucket\":\"${DESTINATION_BUCKET}\"}}"

  cypress-real-user-tests:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    steps:
      - git-shallow-clone/checkout
      - npm-and-cypress-install
      - run:
          name: Create Cypress Artifacts Directory
          command: mkdir /tmp/cypress
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
      - run:
          name: 'Cypress Real User Tests'
          command: |
            set +e
            npm run cypress:real-users
            echo "export REAL_USERS_TEST_RESULT=$?" >> $BASH_ENV
            set -e
      - run:
          name: Kill Build if Smoketests Failed
          command: |
            if [ "${REAL_USERS_TEST_RESULT}" -ne 0 ]; then
              exit 1
            fi
      - store_artifacts:
          path: /root/project/cypress/real-users/videos/

  ######################## GLUE JOB: Jobs that run in prod ########################

  restore-postgres:
    docker:
      - image: *efcms-docker-image
        aws_auth:
          aws_access_key_id: $AWS_ACCESS_KEY_ID
          aws_secret_access_key: $AWS_SECRET_ACCESS_KEY
    resource_class: medium+
    environment:
      LOWER_ENV: << pipeline.parameters.lower_env >>
      LOWER_ENV_ACCOUNT_ID: << pipeline.parameters.lower_env_account_id >>
    steps:
      - git-shallow-clone/checkout
      - npm-install
      - run:
          name: Setup Env
          command: |
            ./scripts/env/env-for-circle.sh
            if [[ -z "$LOWER_ENV" ]] || [[ -z "$LOWER_ENV_ACCOUNT_ID" ]]; then
              echo "Error: no lower environment was provided"
              exit 1
            fi
      - run:
          name: Restore Postgres Data
          no_output_timeout: 40m
          command: |
            TARGET_ENV="$LOWER_ENV" TARGET_ACCOUNT_ID="$LOWER_ENV_ACCOUNT_ID" ./scripts/postgres/restoreDbFromSource.ts

only-prod: &only-prod
  context: efcms-<< pipeline.git.branch >>
  filters:
    branches:
      only:
        - prod

only-test: &only-test
  context: efcms-<< pipeline.git.branch >>
  filters:
    branches:
      only:
        - test

only-deployed-lower-environments: &only-deployed-lower-environments
  context: efcms-<< pipeline.git.branch >>
  filters:
    branches:
      only:
        - develop
        - experimental1
        - experimental2
        - experimental3
        - experimental4
        - experimental5
        - experimental6
        - experimental7
        - experimental8
        - experimental9
        - irs
        - migration
        - staging
        - test

workflows:
  version: 2

  build-and-deploy:
    when:
      and:
        - equal: [api, <<pipeline.trigger_source>>] # Only trigger a pipeline build when a user clicks "trigger pipeline"
        - equal: [true, <<pipeline.parameters.run_build_and_deploy>>] # Allow build-and-deploy to be disabled programmatically
    jobs:
      - deploy:
          <<: *only-deployed-lower-environments
      - docker-image-zipper:
          <<: *only-deployed-lower-environments
          requires:
            - deploy
      - migrate:
          <<: *only-deployed-lower-environments
          requires:
            - deploy
      - smoketests:
          <<: *only-deployed-lower-environments
          requires:
            - migrate
      - loadtests:
          <<: *only-deployed-lower-environments
          requires:
            - migrate
      - smoketests-readonly:
          <<: *only-deployed-lower-environments
          requires:
            - migrate
      - api-hosted-environment-tests:
          <<: *only-deployed-lower-environments
          requires:
            - migrate
      - switch-colors:
          <<: *only-deployed-lower-environments
          requires:
            - smoketests
            - loadtests
            - smoketests-readonly
            - api-hosted-environment-tests
      - cleanup:
          <<: *only-deployed-lower-environments
          requires:
            - switch-colors

  build-and-deploy-to-prod:
    when: << pipeline.parameters.run_build_and_deploy_to_prod >>
    jobs:
      - deploy:
          <<: *only-prod
      - docker-image-zipper:
          <<: *only-prod
          requires:
            - deploy
      - migrate:
          <<: *only-prod
          requires:
            - deploy
      - loadtests:
          <<: *only-prod
          requires:
            - migrate
      - smoketests-readonly:
          <<: *only-prod
          requires:
            - migrate
      - deploy-switch-colors-cron:
          <<: *only-prod
          requires:
            - loadtests
            - smoketests-readonly
      - wait-for-switch:
          <<: *only-prod
          type: approval
          requires:
            - deploy-switch-colors-cron
      - disable-switch-colors-cron:
          <<: *only-prod
          requires:
            - wait-for-switch
      - switch-colors:
          <<: *only-prod
          requires:
            - wait-for-switch
      - cleanup:
          <<: *only-prod
          requires:
            - disable-switch-colors-cron
            - switch-colors

  glue-to-test:
    when:
      or:
        - equal: [glue-to-test-schedule, << pipeline.schedule.name >>]
        - << pipeline.parameters.run_glue_to_test >>
    jobs:
      - delete-and-recreate-elasticsearch-cluster:
          <<: *only-test
      - initiate-glue-job:
          <<: *only-test
      - wait-for-s3-sync-workflow:
          <<: *only-test
          type: approval
          requires:
            - initiate-glue-job
      - wait-for-glue-workflow:
          <<: *only-test
          type: approval
          requires:
            - initiate-glue-job
      - migrate-restored-postgres-data:
          <<: *only-test
          requires:
            - delete-and-recreate-elasticsearch-cluster
            - wait-for-glue-workflow
      - index-cases:
          <<: *only-test
          requires:
            - migrate-restored-postgres-data
      - index-users:
          <<: *only-test
          requires:
            - index-cases
      - index-docket-entries:
          <<: *only-test
          requires:
            - wait-for-s3-sync-workflow
            - index-users
      - cleanup-glue-job:
          <<: *only-test
          requires:
            - index-docket-entries

  glue-to-lower-env:
    when: << pipeline.parameters.run_glue_to_lower_env >>
    jobs:
      - restore-postgres:
          <<: *only-prod

  s3-to-test:
    when: << pipeline.parameters.run_s3_to_test >>
    jobs:
      - initiate-s3-sync:
          <<: *only-test
      - wait-for-s3-sync-workflow:
          <<: *only-test
          type: approval
          requires:
            - initiate-s3-sync

  sync-s3-to-lower-env:
    when: << pipeline.parameters.run_sync_s3_to_lower_env >>
    jobs:
      - sync-s3-buckets-with-timeout:
          <<: *only-deployed-lower-environments

  reindex-opensearch:
    when: << pipeline.parameters.run_reindex_opensearch >>
    jobs:
      - delete-and-recreate-elasticsearch-cluster:
          <<: *only-deployed-lower-environments
      - index-cases:
          <<: *only-deployed-lower-environments
          requires:
            - delete-and-recreate-elasticsearch-cluster
      - index-users:
          <<: *only-deployed-lower-environments
          requires:
            - index-cases
      - index-docket-entries:
          <<: *only-deployed-lower-environments
          requires:
            - index-users

  real-user-tests:
    when: << pipeline.parameters.run_real_user_tests >>
    jobs:
      - cypress-real-user-tests:
          <<: *only-test
