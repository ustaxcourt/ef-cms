name: Node.js CI - Scripts

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  Scripts:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/template_no-app.yml
    with:
      coverage_source_dir: scripts/coverage
      run_command: npm run test:scripts
      workflow_filename: scripts.yml
  check-coverage:
    needs: [Scripts]
    uses: ./.github/workflows/job_check-coverage.yml
    with:
      branches: 97
      coverage_source_dir: scripts/coverage
      coverage_suite: scripts
      functions: 99
      lines: 99
      pull_request_number: ${{ github.event.pull_request.number }}
      statements: 99
      workflow_filename: scripts.yml
