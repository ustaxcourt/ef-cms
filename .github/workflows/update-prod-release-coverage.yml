name: Update Prod Release Coverage

on:
  workflow_run:
    workflows:
      - Node.js CI - API
      - Node.js CI - Client Unit Tests
      - Node.js CI - Scripts
      - Node.js CI - Shared
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  update-prod-release-coverage:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.pull_requests[0].base.ref == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: NPM Install in Current Branch
        uses: ./.github/actions/dawson-node-bootstrap
      - name: Update coverage table when all suite summaries are ready
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          scripts/github-actions/update-prod-release-coverage.ts \
            "${RELEASE_PULL_REQUEST_NUMBER}" \
            "${RELEASE_HEAD_SHA}"
