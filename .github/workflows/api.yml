name: Node.js CI - API

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  API:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/template_no-app.yml
    with:
      run_command: npm run test:api
  check-coverage:
    needs: [API]
    uses: ./.github/workflows/job_check-coverage.yml
    with:
      branches: 90
      coverage_source_dir: web-api/coverage
      coverage_suite: api
      functions: 90
      lines: 90
      pull_request_number: ${{ github.event.pull_request.number }}
      statements: 90
      workflow_filename: api.yml
  update-coverage-table:
    if: ${{ github.event.pull_request.base.ref == 'prod' }}
    needs: [check-coverage]
    runs-on: ubuntu-latest
    env:
      COMPOSITE_COVERAGE_SUMMARY_PATH: /tmp/api-pr-${{ github.event.pull_request.number }}-coverage-summary.json
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: NPM Install in Current Branch
        uses: ./.github/actions/dawson-node-bootstrap
      - name: Download composite coverage summary
        uses: actions/download-artifact@v7
        with:
          name: coverage-summary-api-pr-${{ github.event.pull_request.number }}
          path: /tmp
      - name: Update coverage table
        run: |
          scripts/github-actions/update-prod-release-coverage.ts \
            "${COMPOSITE_COVERAGE_SUMMARY_PATH}" \
            ${{ github.event.pull_request.number }}
