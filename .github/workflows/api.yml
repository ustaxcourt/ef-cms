name: Node.js CI - API

on:
  pull_request:

jobs:
  API:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      - name: Restore Cache Dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install Node Dependencies - Cache Miss Install
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        id: npm-clean-install
        run: npm ci
      - name: Cache Puppeteer Binary
        if: steps.cache-dependencies.outputs.cache-hit == 'true'
        id: cache-puppeteer
        uses: actions/cache/restore@v4
        with:
          path: .cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json') }}
      - name: Install Puppeteer
        if: steps.cache-dependencies.outputs.cache-hit == 'true' && steps.cache-puppeteer.outputs.cache-hit != 'true'
        id: install-puppeteer
        run: npx puppeteer browsers install chrome
      - name: API
        run: npm run test:api
      - name: Save Cache Dependencies
        if: steps.npm-clean-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Save Puppeteer Dependencies
        if: steps.npm-clean-install.outcome == 'success' || steps.install-puppeteer.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json') }}
