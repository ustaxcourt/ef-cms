name: Compile Composite Coverage

on:
  pull_request_target:
    branches:
      - staging
    types:
      - closed
  workflow_run:
    workflows:
      - Node.js CI - API
      - Node.js CI - Client Unit Tests
      - Node.js CI - Scripts
      - Node.js CI - Shared
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update-prod-release-coverage:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(github.event.workflow_run.pull_requests.*.base.ref, 'prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coverage updater dependencies
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .nvmrc
            package-lock.json
            package.json
            scripts/github-actions/suite-coverage.helpers.ts
            scripts/github-actions/update-prod-release-coverage.ts
            scripts/github-actions/update-prod-release-coverage.helpers.ts
            scripts/helpers/parseArgsAndEnvVars.ts
            shared/admin-tools/aws/ssmHelper.ts
            shared/admin-tools/util.ts
            shared/src/business/utilities/DateHandler.ts
            tsconfig.json
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Restore Node Dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: NPM Install Trusted Dependencies
        if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
        run: npm ci --ignore-scripts
      - name: Update coverage table when all suite summaries are ready
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_PULL_REQUEST_NUMBER: ${{ join(github.event.workflow_run.pull_requests.*.number, ',') }}
        run: |
          scripts/github-actions/update-prod-release-coverage.ts \
            "${RELEASE_PULL_REQUEST_NUMBER}" \
            "${RELEASE_HEAD_SHA}"
  generate-coverage-badges:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Create badge bot token
        id: badge-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BADGE_BOT_APP_ID }}
          owner: ${{ github.repository_owner }}
          private-key: ${{ secrets.BADGE_BOT_RSA_KEY }}
          repositories: ef-cms
      - name: Checkout badge generator dependencies
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: true
          token: ${{ steps.badge-bot-token.outputs.token }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Restore Node Dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: NPM Install Trusted Dependencies
        if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
        run: npm ci --ignore-scripts
      - name: Gather Suite Coverage Summaries
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          scripts/github-actions/compile-suite-coverage.ts \
            "${STAGING_PULL_REQUEST_NUMBER}" \
            "coverage"
      - name: Generate API Coverage Badges
        uses: jpb06/coverage-badges-action@latest
        with:
          badges-labels-prefix: API
          coverage-summary-path: coverage/api/coverage-summary.json
          no-commit: 'true'
          output-folder: docs/badges/api
      - name: Generate Client Coverage Badges
        uses: jpb06/coverage-badges-action@latest
        with:
          badges-labels-prefix: Client
          coverage-summary-path: coverage/client/coverage-summary.json
          no-commit: 'true'
          output-folder: docs/badges/client
      - name: Generate Scripts Coverage Badges
        uses: jpb06/coverage-badges-action@latest
        with:
          badges-labels-prefix: Scripts
          coverage-summary-path: coverage/scripts/coverage-summary.json
          no-commit: 'true'
          output-folder: docs/badges/scripts
      - name: Generate Shared Coverage Badges
        uses: jpb06/coverage-badges-action@latest
        with:
          badges-labels-prefix: Shared
          coverage-summary-path: coverage/shared/coverage-summary.json
          no-commit: 'true'
          output-folder: docs/badges/shared
      - name: Commit badges to staging
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: staging
          commit_author: 'efcms-badge-bot[bot] <efcms-badge-bot[bot]@users.noreply.github.com>'
          commit_message: 'Update coverage badges with coverage from PR #${{ github.event.pull_request.number }}'
          commit_user_email: 'efcms-badge-bot[bot]@users.noreply.github.com'
          commit_user_name: 'efcms-badge-bot[bot]'
          file_pattern: docs/badges
          push_options: '--force'
