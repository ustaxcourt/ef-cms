name: Node.js CI - Client Unit Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  Client:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [2]
        ci_node_index: [0, 1]
    uses: ./.github/workflows/template_no-app-parallel.yml
    with:
      ci_node_index: ${{ matrix.ci_node_index }}
      ci_node_total: ${{ matrix.ci_node_total }}
      coverage_source_dir: web-client/coverage/${{ matrix.ci_node_index }}
      fetch_depth: 0
      splitter_command: scripts/github-actions/split-tests-glob.ts webClientUnit
      test_command: NODE_INDEX=${{ matrix.ci_node_index }} npm run test:client:unit:ci
      workflow_filename: client.yml
  check-coverage:
    needs: [Client]
    uses: ./.github/workflows/job_check-coverage.yml
    with:
      branches: 90
      coverage_suite: client
      functions: 90
      lines: 90
      pull_request_number: ${{ github.event.pull_request.number }}
      statements: 90
      workflow_filename: client.yml
  persist-test-file-times:
    needs: [Client]
    uses: ./.github/workflows/job_persist-test-file-times.yml
    with:
      workflow_filename: client.yml
