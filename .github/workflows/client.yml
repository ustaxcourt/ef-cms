name: Node.js CI - Client Unit Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  Client:
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]
    uses: ./.github/workflows/templates/no-app-parallel.yml
    with:
      ci_node_index: ${{ matrix.ci_node_index }}
      ci_node_total: ${{ matrix.ci_node_total }}
      coverage_source_dir: web-client/coverage/${{ matrix.ci_node_index }}
      fetch_depth: 0
      splitter_command: scripts/github-actions/split-tests-glob.ts -unit
      test_command: NODE_INDEX=${{ matrix.ci_node_index }} npm run test:client:unit:ci
      workflow_filename: client.yml
  check-coverage:
    needs: [Client]
    uses: ./.github/workflows/shared/check-coverage.yml
    with:
      branches: 90
      functions: 90
      lines: 90
      statements: 90
  persist-test-file-times:
    needs: [Client]
    uses: ./.github/workflows/shared/persist-test-file-times.yml
    with:
      workflow_filename: client.yml
