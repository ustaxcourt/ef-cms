name: Node.js CI - Client Unit Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]
    env:
      CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
      CI_NODE_INDEX: ${{ matrix.ci_node_index }}
      JEST_TEST_RESULTS_FILE: /tmp/test-file-times/jest-results-${{ matrix.ci_node_index }}.json
      TEST_FILE_TIMINGS_PATH: /tmp/test-file-times/historical-test-file-times.json
      TEST_FILE_TIMINGS_SHARD_FILE: /tmp/test-file-times/test-file-times-${{ matrix.ci_node_index }}.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      - name: Restore Cache Dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .cache/puppeteer
            /home/runner/.cache/Cypress
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install Node Dependencies - Cache Miss Install
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        id: npm-clean-install
        run: npm ci
      - name: Restore historical test file timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx ts-node scripts/download-historical-test-file-times.ts client.yml historical-test-file-times $TEST_FILE_TIMINGS_PATH
      - name: Test Client Unit
        run: |
          mkdir -p /tmp/test-file-times
          export TESTFILES=$(npx ts-node split-tests-glob.ts -unit)
          export JEST_TEST_RESULTS_ARGS="--json --outputFile=${JEST_TEST_RESULTS_FILE}"
          NODE_INDEX=${{ matrix.ci_node_index }} npm run test:client:unit:ci
      - name: Record shard test file timings
        if: always()
        run: |
          if [[ -f "${JEST_TEST_RESULTS_FILE}" ]]; then
            npx ts-node scripts/test-file-times.ts from-jest "${JEST_TEST_RESULTS_FILE}" "${TEST_FILE_TIMINGS_SHARD_FILE}"
          fi
      - name: Rename coverage to shard coverage
        run: |
          mkdir -p coverage
          cp web-client/coverage/${{ matrix.ci_node_index }}/lcov.info coverage/lcov-${{ matrix.ci_node_index }}.info
          cp web-client/coverage/${{ matrix.ci_node_index }}/coverage-final.json coverage/coverage-${{ matrix.ci_node_index }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts-${{ matrix.ci_node_index }}
          path: coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: ignore
          name: historical-test-file-times-shard-${{ matrix.ci_node_index }}
          path: ${{ env.TEST_FILE_TIMINGS_SHARD_FILE }}
      - name: Save Cache Dependencies
        if: steps.npm-clean-install.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            .cache/puppeteer
            /home/runner/.cache/Cypress
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
  check-coverage:
    runs-on: ubuntu-latest
    needs: [Client]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-artifacts-*
          merge-multiple: true
          path: coverage
      - name: Process Coverage
        run: npx nyc report --check-coverage --branches 90 --functions 90 --lines 90 --statements 90 --reporter lcov --reporter text --reporter clover -t coverage
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: coverage-artifacts
          failOnError: false
  persist-test-file-times:
    runs-on: ubuntu-latest
    needs: [Client]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: historical-test-file-times-shard-*
          merge-multiple: true
          path: /tmp/test-file-times/shards
      - name: Merge test file timings
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          output_path = '/tmp/test-file-times/historical-test-file-times.json'
          merged = {}

          for file_path in sorted(glob.glob('/tmp/test-file-times/shards/*.json')):
              with open(file_path) as input_file:
                  merged.update(json.load(input_file))

          os.makedirs(os.path.dirname(output_path), exist_ok=True)
          with open(output_path, 'w') as output_file:
              json.dump(merged, output_file, indent=2)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: historical-test-file-times
          path: /tmp/test-file-times/historical-test-file-times.json
