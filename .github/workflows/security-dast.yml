name: Security - DAST

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.nvmrc'
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false   # don't cancel DAST mid-scan; findings may be partial

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: API scan — runs on every non-draft PR to staging
  # Scans as two roles: petitionsclerk (privileged clerk) and petitioner (low-priv).
  # ZAP api-scan fuzzes off swagger.json; in-app RBAC (isAuthorized in interactors)
  # is enforced identically locally and in prod, so role-specific surface is real.
  # NOTE: token-forgery / alg:none / expired-token ZAP findings against localhost:4000
  # are local-only artifacts — the Cognito authorizer (signature verification) only
  # runs in deployed API Gateway. Triage those findings as out-of-scope for this job;
  # see scripts/circleci/verify-authorizers.sh for the deployed edge trust-boundary check.
  # ─────────────────────────────────────────────────────────────────────────────
  dast-api:
    name: ZAP API Scan (${{ matrix.role }})
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed for SARIF upload to Security tab
    timeout-minutes: 45
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: petitionsclerk
            username: petitionsclerk@example.com
          - role: petitioner
            username: petitioner@example.com
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: example
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: NPM Install
        uses: ./.github/actions/dawson-node-bootstrap

      - name: Configure sysctl
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144

      - name: Setup OpenSearch
        uses: ankane/setup-opensearch@v1
        with:
          opensearch-version: 3.5.0

      - name: Prepare Postgres
        run: |
          npm run migration:postgres
          npm run migration:postgres:contract
          npm run seed:postgres

      - name: Start DAWSON
        run: |
          npm run start:all:ci >> /tmp/dast-dawson-output.txt 2>&1 &

      - name: Wait for DAWSON
        run: |
          WAIT_FOR_CLIENT=1 WAIT_FOR_PUBLIC=1 ./wait-until-services.sh

      - name: Acquire ZAP auth token (${{ matrix.role }})
        env:
          ZAP_USERNAME: ${{ matrix.username }}
        run: node scripts/get-local-zap-token.mjs "$ZAP_USERNAME"

      - name: ZAP API Scan (${{ matrix.role }})
        continue-on-error: true
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:4000/api/swagger.json'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-z "-configfile /zap/wrk/options-${{ matrix.role }}.prop"'

      - name: Upload ZAP API report (${{ matrix.role }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-api-report-${{ matrix.role }}
          path: report_html
          retention-days: 30

      - name: Upload SARIF to Security tab (${{ matrix.role }})
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report_json
          category: zap-api-${{ matrix.role }}
        continue-on-error: true

      - name: Upload DAWSON logs (${{ matrix.role }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-dawson-logs-${{ matrix.role }}
          path: /tmp/dast-dawson-output.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Full web scan — weekly schedule + manual dispatch only (NOT on PRs)
  # ─────────────────────────────────────────────────────────────────────────────
  dast-web:
    name: ZAP Web Full Scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 75
    env:
      CI: true
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: example
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: NPM Install
        uses: ./.github/actions/dawson-node-bootstrap

      - name: Configure sysctl
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144

      - name: Setup OpenSearch
        uses: ankane/setup-opensearch@v1
        with:
          opensearch-version: 3.5.0

      - name: Prepare Postgres
        run: |
          npm run migration:postgres
          npm run migration:postgres:contract
          npm run seed:postgres

      - name: Start DAWSON
        run: |
          npm run start:all:ci >> /tmp/dast-web-dawson-output.txt 2>&1 &

      - name: Wait for DAWSON
        run: |
          WAIT_FOR_CLIENT=1 WAIT_FOR_PUBLIC=1 ./wait-until-services.sh

      - name: Acquire ZAP auth token
        run: node scripts/get-local-zap-token.mjs

      - name: ZAP Full Scan — Private Client
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:1234/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-z "-configfile /zap/wrk/options-petitionsclerk.prop"'
          artifact_name: zap-web-private-report

      - name: ZAP Full Scan — Public Client
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:5678/'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zap-web-public-report

      - name: Upload DAWSON logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-web-dawson-logs
          path: /tmp/dast-web-dawson-output.txt
          retention-days: 14
