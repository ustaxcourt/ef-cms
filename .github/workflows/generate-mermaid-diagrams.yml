name: Generate Mermaid Diagrams

on:
  push:
    paths:
      - '**.mmd'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Generate PNG from Mermaid
        run: |
          find . -name "*.mmd" -type f | while read mermaid_file; do
            output_file="${mermaid_file%.mmd}.png"
            echo "Generating $output_file from $mermaid_file"
            mmdc -i "$mermaid_file" -o "$output_file" -b transparent
          done

      - name: Commit generated diagram
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "*.png"

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate diagrams [skip ci]"
            git push
          fi
