name: Security - Containers

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - 'docs/**'
  workflow_dispatch:
  push:
    branches: [staging]
    # Only these paths change what the images contain or how they are scanned. Keep in sync
    # with IMAGE_PATHS in the changes job below.
    paths:
      - '**/Dockerfile*'
      - 'web-api/terraform/modules/batch/docker-image/**'
      - 'web-api/runtimes/puppeteer/package*.json'
      - '.github/workflows/security-containers.yml'
      - '.github/actions/dawson-container-images/**'
      - '.github/actions/dawson-runtime-image/**'
      - '.github/actions/dawson-trivy-image-scan/**'
      - '.github/actions/dawson-upload-sarif/**'
      - '.github/actions/dawson-sarif-summary/**'
  # New CVEs are published against images we have not changed, which no path filter sees.
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Staging pushes queue: a cancelled run still uploads a partial, failed analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db

jobs:
  trivy-config:
    name: Trivy Dockerfile Config
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy config scan (Dockerfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: 'MEDIUM,HIGH,CRITICAL,UNKNOWN'
          # trivy-action drops the severity filter for SARIF unless this is set
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif
          skip-dirs: 'node_modules,.terraform,web-api/terraform,coverage,dist,dist-public,dist-lambdas,cypress'
          # >>> CONFIRM WITH JIM BEFORE FLIPPING THIS TO BLOCKING <<<
          exit-code: '0'

      - name: Upload SARIF
        if: always()
        uses: ./.github/actions/dawson-upload-sarif
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # trivy-config runs on every PR since it builds nothing. The image scans only run when
  # the PR changes something that can change their results.
  changes:
    name: Detect image changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR merge commit and its base, so HEAD^1..HEAD is the PR's diff.
          fetch-depth: 2

      - name: Diff against base
        id: diff
        env:
          # Keep in sync with the push trigger paths above.
          IMAGE_PATHS: '(^|/)Dockerfile[^/]*$|^web-api/terraform/modules/batch/docker-image/|^web-api/runtimes/puppeteer/package(-lock)?\.json$|^\.github/workflows/security-containers\.yml$|^\.github/actions/dawson-(container-images|runtime-image|trivy-image-scan|upload-sarif|sarif-summary)/'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE "$IMAGE_PATHS"; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
            echo "No image build input or scan tooling changes; skipping image scans." >> "$GITHUB_STEP_SUMMARY"
          fi

  trivy-image:
    name: Trivy Image Scan (core)
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # efcms-local is not scanned: it is FROM ef-cms-us-east-1 and adds no OS packages,
      # so Trivy reports the same CVEs under a second image name.
      - name: Build DAWSON container images
        uses: ./.github/actions/dawson-container-images
        with:
          build_local: 'false'

      - name: Trivy scan — ef-cms-us-east-1 (base)
        uses: ./.github/actions/dawson-trivy-image-scan
        with:
          image_ref: ef-cms-us-east-1:latest
          report_path: trivy-base.sarif
          category: trivy-image-base

  # Builds each image from its Dockerfile, so packages the Dockerfile adds (apt-get, global
  # npm installs) are scanned along with the base image's.
  trivy-runtime-image:
    name: Trivy Image Scan (${{ matrix.name }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: [puppeteer, batch]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        id: build
        uses: ./.github/actions/dawson-runtime-image
        with:
          image: ${{ matrix.name }}

      - name: Trivy scan — ${{ steps.build.outputs.image_ref }}
        uses: ./.github/actions/dawson-trivy-image-scan
        with:
          image_ref: ${{ steps.build.outputs.image_ref }}
          report_path: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: staging baseline (non-blocking). Runs on merges to staging that change image paths
  # and weekly, and scans every distinct image, so the Security tab holds a complete picture
  # of what's actually live. This is where we discover the full CVE set to triage into .trivyignore.
  # Mirrors the gitleaks-baseline pattern in the sibling workflows.
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-baseline:
    name: Trivy Baseline (staging)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # efcms-local is not scanned: see the note in the trivy-image job above.
      - name: Build DAWSON container images
        uses: ./.github/actions/dawson-container-images
        with:
          build_local: 'false'

      - name: Trivy scan — ef-cms-us-east-1 (baseline)
        uses: ./.github/actions/dawson-trivy-image-scan
        with:
          image_ref: ef-cms-us-east-1:latest
          report_path: trivy-baseline-base.sarif
          category: trivy-baseline-base

      - name: Build puppeteer image
        id: puppeteer
        uses: ./.github/actions/dawson-runtime-image
        with:
          image: puppeteer

      - name: Trivy scan — ${{ steps.puppeteer.outputs.image_ref }} (baseline)
        uses: ./.github/actions/dawson-trivy-image-scan
        with:
          image_ref: ${{ steps.puppeteer.outputs.image_ref }}
          report_path: trivy-baseline-puppeteer.sarif
          category: trivy-baseline-puppeteer

      - name: Build batch image
        id: batch
        uses: ./.github/actions/dawson-runtime-image
        with:
          image: batch

      - name: Trivy scan — ${{ steps.batch.outputs.image_ref }} (baseline)
        uses: ./.github/actions/dawson-trivy-image-scan
        with:
          image_ref: ${{ steps.batch.outputs.image_ref }}
          report_path: trivy-baseline-batch.sarif
          category: trivy-baseline-batch

  # ─────────────────────────────────────────────────────────────────────────────
  # Aggregate gate. Today every scan is warn-only (exit-code 0), so this only trips
  # on infrastructure failures (build error, action crash). When a scan is flipped
  # to blocking, this is the single check to require in branch protection.
  # ─────────────────────────────────────────────────────────────────────────────
  containers-gate:
    name: Security Gate (Containers)
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    needs: [trivy-config, changes, trivy-image, trivy-runtime-image]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check scan outcomes
        env:
          CONFIG_RESULT: ${{ needs.trivy-config.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGE_RESULT: ${{ needs.trivy-image.result }}
          RUNTIME_RESULT: ${{ needs.trivy-runtime-image.result }}
        run: |
          if [[ "$CONFIG_RESULT" == "failure" ]]; then
            echo "Trivy Dockerfile config scan failed — see the Security tab for details"
            exit 1
          fi
          if [[ "$CHANGES_RESULT" == "failure" ]]; then
            echo "Could not determine which files changed — image scans did not run"
            exit 1
          fi
          if [[ "$IMAGE_RESULT" == "failure" ]]; then
            echo "Trivy core image scan failed — see the Security tab for details"
            exit 1
          fi
          if [[ "$RUNTIME_RESULT" == "failure" ]]; then
            echo "Trivy batch or puppeteer image scan failed — see the Security tab for details"
            exit 1
          fi
          echo "Containers gate passed"
