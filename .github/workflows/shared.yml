name: Node.js CI - Shared

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  Shared:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]
    env:
      CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
      CI_NODE_INDEX: ${{ matrix.ci_node_index }}
      JEST_TEST_RESULTS_FILE: /tmp/test-file-times/jest-results-${{ matrix.ci_node_index }}.json
      TEST_FILE_TIMINGS_PATH: /tmp/test-file-times/historical-test-file-times.json
      TEST_FILE_TIMINGS_SHARD_FILE: /tmp/test-file-times/test-file-times-${{ matrix.ci_node_index }}.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      - name: Restore Cache Dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .cache/puppeteer
            /home/runner/.cache/Cypress
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install Node Dependencies - Cache Miss Install
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        id: npm-clean-install
        run: npm ci
      - name: Restore historical test file timings
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/github-actions/download-historical-test-file-times.ts shared.yml historical-test-file-times $TEST_FILE_TIMINGS_PATH
      - name: Shared
        run: |
          mkdir -p /tmp/test-file-times
          export TESTFILES=$(scripts/github-actions/split-tests-glob.ts -shared)
          export JEST_TEST_RESULTS_ARGS="--json --outputFile=${JEST_TEST_RESULTS_FILE}"
          NODE_INDEX=${{ matrix.ci_node_index }} npm run test:shared:ci
      - name: Record shard test file timings
        if: always()
        run: |
          if [[ -f "${JEST_TEST_RESULTS_FILE}" ]]; then
            scripts/github-actions/test-file-times.ts from-jest "${JEST_TEST_RESULTS_FILE}" "${TEST_FILE_TIMINGS_SHARD_FILE}"
          fi
      - name: Rename coverage to shard coverage
        run: |
          mkdir -p coverage
          cp shared/coverage/${{ matrix.ci_node_index }}/lcov.info coverage/lcov-${{ matrix.ci_node_index }}.info
          cp shared/coverage/${{ matrix.ci_node_index }}/coverage-final.json coverage/coverage-${{ matrix.ci_node_index }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts-${{ matrix.ci_node_index }}
          path: coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: ignore
          name: historical-test-file-times-shard-${{ matrix.ci_node_index }}
          path: ${{ env.TEST_FILE_TIMINGS_SHARD_FILE }}
      - name: Save Cache Dependencies
        if: steps.npm-clean-install.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            .cache/puppeteer
            /home/runner/.cache/Cypress
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
  check-coverage:
    runs-on: ubuntu-latest
    needs: [Shared]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-artifacts-*
          merge-multiple: true
          path: coverage
      - name: Process Coverage
        run: npx nyc report --check-coverage --branches 95 --functions 95 --lines 95 --statements 95 --reporter lcov --reporter text --reporter clover -t coverage
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: coverage-artifacts
          failOnError: false
  persist-test-file-times:
    runs-on: ubuntu-latest
    needs: [Shared]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: historical-test-file-times-shard-*
          merge-multiple: true
          path: /tmp/test-file-times/shards
      - name: Merge test file timings
        run: |
          scripts/github-actions/test-file-times.ts merge /tmp/test-file-times/historical-test-file-times.json /tmp/test-file-times/shards/*.json
      - uses: actions/upload-artifact@v7
        with:
          name: historical-test-file-times-${{ github.sha }}
          path: /tmp/test-file-times/historical-test-file-times.json
