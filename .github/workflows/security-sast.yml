name: Security - SAST

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - 'docs/**'
  push:
    # TEMP(10094): added feature branch to validate the CodeQL job on push.
    # REVERT to `branches: [staging]` once CodeQL is confirmed working.
    branches: [staging, 10094-devex-vuln-scanning]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.165.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/react \
            --config p/jwt \
            --config p/sql-injection \
            --config p/xss \
            --config p/command-injection \
            --config p/expressjs \
            --config .semgrep/ \
            --sarif --output semgrep-results.sarif \
            --error \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='dist' \
            --exclude='dist-public' \
            --exclude='dist-lambdas' \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            --exclude='cypress' \
            --exclude='aws/lambdas' \
            --exclude='.terraform' \
            --exclude='docs' \
            --metrics=off \
            --baseline-commit "$BASE_SHA"

      - name: Upload SARIF
        # Fork PRs get a read-only token, so the code-scanning upload (needs
        # security-events: write) 403s and would block an otherwise-clean PR.
        # Restrict the upload to same-repo PRs; fork PRs still scan + gate via
        # the Semgrep exit code, with findings visible in the Actions log.
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  codeql:
    name: CodeQL Deep Analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  security-gate:
    name: Security Gate (SAST)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: [semgrep]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "SAST gate passed"
