name: Verify PDFS

on:
  pull_request:

jobs:
  test_pdfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]
    env:
      CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
      CI_NODE_INDEX: ${{ matrix.ci_node_index }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      - name: Setup
        run: |
          docker build --platform=linux/amd64 -t efcms -f Dockerfile .
          docker build --platform=linux/amd64 -t efcms-local -f Dockerfile-local .
          export TESTFILES=$(npx ts-node split-tests-glob.ts -pdfs ${{ matrix.ci_node_index }} ${{ matrix.ci_node_total }})
          docker run --platform=linux/amd64 -i --rm -v `pwd`/shared/test-output:/home/app/shared/test-output efcms-local sh -c "npm run test:document-generation $TESTFILES"
