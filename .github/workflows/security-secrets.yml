name: Security - Secrets

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

    paths-ignore:
      - '**/.gitignore'
      - '.nvmrc'
  push:
    branches: [staging]
    # The coverage badge bot pushes immediately after each merge; badges cannot change results.
    paths-ignore:
      - 'docs/badges/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Staging pushes queue: a cancelled run still uploads a partial, failed analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  capture-start-time:
    runs-on: ubuntu-latest

    outputs:
      workflow_start: ${{ steps.time.outputs.timestamp }}

    steps:
      - name: Capture workflow start
        id: time
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Gitleaks Secret Scan
    needs: capture-start-time
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks (diff-scoped)
        uses: ./.github/actions/dawson-gitleaks
        with:
          log_opts: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Upload SARIF
        if: always()
        uses: ./.github/actions/dawson-upload-sarif
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  gitleaks-baseline:
    name: Gitleaks Baseline (staging)
    needs: capture-start-time
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full tree, non-blocking)
        # Non-blocking: pre-existing findings in a public repo need rotation, not removal.
        # This job populates the Security tab baseline without breaking staging merges.
        uses: ./.github/actions/dawson-gitleaks
        with:
          exit_code: '0'

      - name: Upload SARIF
        if: always()
        uses: ./.github/actions/dawson-upload-sarif
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-baseline

  secrets-gate:
    name: Security Gate (Secrets)
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: [gitleaks]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check scan outcomes
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          if [[ "$GITLEAKS_RESULT" == "failure" ]]; then
            echo "Gitleaks scan found secrets — see the Security tab for details"
            exit 1
          fi
          echo "Secrets gate passed"

  notify-teams:
    needs:
      - capture-start-time
      - gitleaks-baseline

    if: >
      always() &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )

    uses: ./.github/workflows/notify-teams.yml

    with:
      workflow_start: ${{ needs.capture-start-time.outputs.workflow_start }}
      scanner: Secrets
      workflow_name: Security - Secrets
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    secrets: inherit
