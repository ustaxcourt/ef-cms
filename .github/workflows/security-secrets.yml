name: Security - Secrets

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

    paths-ignore:
      - '**/.gitignore'
      - '.nvmrc'
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks (diff-scoped)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF
        # Fork PRs get a read-only token — skip upload, still gates via exit code above.
        if: >-
          always() &&
          hashFiles('gitleaks.sarif') != '' &&
          github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  gitleaks-baseline:
    name: Gitleaks Baseline (staging)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks (full tree, non-blocking)
        # Non-blocking: pre-existing findings in a public repo need rotation, not removal.
        # This job populates the Security tab baseline without breaking staging merges.
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 0 || true

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-baseline

  secrets-gate:
    name: Security Gate (Secrets)
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: [gitleaks]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check scan outcomes
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          if [[ "$GITLEAKS_RESULT" == "failure" ]]; then
            echo "Gitleaks scan found secrets — see the Security tab for details"
            exit 1
          fi
          echo "Secrets gate passed"
