name: Security - Secrets

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

    paths-ignore:
      - '**/.gitignore'
      - '.nvmrc'
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (diff-scoped)
        uses: ./.github/actions/dawson-gitleaks
        with:
          log_opts: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Upload SARIF
        if: always()
        uses: ./.github/actions/dawson-upload-sarif
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  gitleaks-baseline:
    name: Gitleaks Baseline (staging)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full tree, non-blocking)
        # Non-blocking: pre-existing findings in a public repo need rotation, not removal.
        # This job populates the Security tab baseline without breaking staging merges.
        uses: ./.github/actions/dawson-gitleaks
        with:
          exit_code: '0'

      - name: Upload SARIF
        if: always()
        uses: ./.github/actions/dawson-upload-sarif
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-baseline

  secrets-gate:
    name: Security Gate (Secrets)
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: [gitleaks]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check scan outcomes
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          if [[ "$GITLEAKS_RESULT" == "failure" ]]; then
            echo "Gitleaks scan found secrets — see the Security tab for details"
            exit 1
          fi
          echo "Secrets gate passed"
