name: E2E Cypress Public

on:
  pull_request:

jobs:
  e2e_cypress_public:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [3]
        ci_node_index: [0, 1, 2]
    env:
      CI: true
      CHECK_DEPLOY_DATE_INTERVAL: 5000
      CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
      CI_NODE_INDEX: ${{ matrix.ci_node_index }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: example
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup OpenSearch
        uses: ankane/setup-opensearch@v1
        with:
          opensearch-version: 2.11
      - name: Setup DynamoDB Local
        uses: codyseibert/dynamodb-action@v4.1.0
        with:
          port: 8000
          cors: '*'
          version: '2.6.1'
      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      - name: Install Node Dependencies
        run: npm ci
      - name: Setup Postgres
        run: |
          npm run migration:postgres
          npm run seed:postgres
      - name: Run E2E Cypress
        run: |
          mkdir -p /tmp/cypress/
          npm run start:all:ci >> /tmp/cypress/cypress-output.txt &
          ./wait-until-services.sh
          sleep 5
          # Get all public test files and split them across parallel jobs
          export TESTFILES=$(find cypress/local-only/tests -name "*.cy.ts" -path "*/public/*" | sort | awk "NR % ${{ matrix.ci_node_total }} == ${{ matrix.ci_node_index }}")
          echo "Running tests for job ${{ matrix.ci_node_index }}: $TESTFILES"
          if [ -n "$TESTFILES" ]; then
            npm run cypress:integration:file $TESTFILES
          else
            echo "No tests assigned to this job"
          fi
      - name: Store Cypress Failure Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.ci_node_index }}
          path: ${{ github.workspace }}/cypress/local-only/videos
