name: E2E Cypress

on:
  pull_request:

jobs:
  e2e_cypress:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [9]
        ci_node_index: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CI: true
      CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
      CI_NODE_INDEX: ${{ matrix.ci_node_index }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: example
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup OpenSearch
        uses: ankane/setup-opensearch@v1
        with:
          opensearch-version: 2.11
      - name: Setup DynamoDB Local
        uses: codyseibert/dynamodb-action@v4.1.0
        with:
          port: 8000
          cors: '*'
          version: '2.6.1'
      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v2
        with:
          comment_on_pr: false
      # - name: Cache Cypress binary
      #   id: cache-cypress
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/Cypress
      #     key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json') }}
      #     restore-keys: |
      #       ${{ runner.os }}-cypress-
      - name: Cache Puppeteer Binary
        id: cache-puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package-lock.json') }}
      - name: Restore Cache Dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - name: Install Node Dependencies - Cache Miss Install
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install Cypress Binary
        # if: steps.cache-cypress.outputs.cache-hit != 'true'
        run: npx cypress install
      - name: Install Puppeteer
        if: steps.cache-puppeteer.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome
      - name: Setup Postgres
        run: |
          npm run migration:postgres
          npm run seed:postgres
      - name: Run E2E Cypress
        run: |
          mkdir -p /tmp/cypress/
          npm run start:all:ci &
          ./wait-until-services.sh
          sleep 5
          export TESTFILES=$(npx ts-node split-tests-cypress.ts integration)
          npm run cypress:integration:file $TESTFILES
      - name: Store Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.ci_node_index }}
          path: ${{ github.workspace }}/cypress/local-only/videos
