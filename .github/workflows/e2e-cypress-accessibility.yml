name: E2E Cypress Accessibility

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  e2e_cypress_accessibility:
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [6]
        ci_node_index: [0, 1, 2, 3, 4, 5]
    uses: ./.github/workflows/template_app-parallel.yml
    with:
      ci_environment: 'true'
      ci_node_index: ${{ matrix.ci_node_index }}
      ci_node_total: ${{ matrix.ci_node_total }}
      fetch_depth: 0
      is_cypress: true
      run_command: |
        export TESTFILES=$(scripts/github-actions/split-tests-cypress.ts accessibility)
        scripts/tests/run-cypress.ts --file "$TESTFILES" --output-file-path "$TEST_FILE_TIMINGS_SHARD_FILE"
      workflow_filename: e2e-cypress-accessibility.yml
  persist-test-file-times:
    needs: [e2e_cypress_accessibility]
    uses: ./.github/workflows/job_persist-test-file-times.yml
    with:
      workflow_filename: e2e-cypress-accessibility.yml
