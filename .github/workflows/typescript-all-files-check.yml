name: Typescript File Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  CheckAllFilesForTypeErrorCount:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NodeJS Bootstrap Action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/dawson-node-bootstrap
          sparse-checkout-cone-mode: false
      - name: Checkout Current Branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: currentBranch
      - name: Determine Target Branch
        id: target_branch
        run: |
          echo "GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          TARGET_BRANCH=$(jq -r '.pull_request.base.ref' $GITHUB_EVENT_PATH)
          echo "TARGET_BRANCH: $TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
      - name: Checkout Target Branch
        uses: actions/checkout@v6
        with:
          repository: ustaxcourt/ef-cms
          ref: ${{ env.TARGET_BRANCH }}
          path: targetBranch
      - name: NPM Install in Current Branch
        uses: ./.github/actions/dawson-node-bootstrap
        with:
          node-version-file: currentBranch/.nvmrc
          restore-cache: 'false'
          save-cache: 'false'
          working-directory: ./currentBranch
      - name: NPM Install in Target Branch
        uses: ./.github/actions/dawson-node-bootstrap
        with:
          restore-cache: 'false'
          save-cache: 'false'
          setup-node: 'false'
          working-directory: ./targetBranch
      - name: Check files for increased error count
        run: npx ts-node currentBranch/scripts/checkAllFilesForTypeErrorCount.ts
