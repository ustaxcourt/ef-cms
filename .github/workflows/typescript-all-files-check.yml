name: Typescript File Check

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - '.nvmrc'
      - '.circleci/config.yml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  CheckAllFilesForTypeErrorCount:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: currentBranch

      - name: Determine Target Branch
        id: target_branch
        run: |
          echo "GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          TARGET_BRANCH=$(jq -r '.pull_request.base.ref' $GITHUB_EVENT_PATH)
          echo "TARGET_BRANCH: $TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Checkout Target Branch
        uses: actions/checkout@v6
        with:
          repository: ustaxcourt/ef-cms
          ref: ${{ env.TARGET_BRANCH }}
          path: targetBranch

      - uses: ./.github/actions/dawson-node-bootstrap
        with:
          node-version-file: currentBranch/.nvmrc
          restore-cache: 'false'
          save-cache: 'false'
          working-directory: ./currentBranch

      - uses: ./.github/actions/dawson-node-bootstrap
        with:
          restore-cache: 'false'
          save-cache: 'false'
          setup-node: 'false'
          working-directory: ./targetBranch

      - name: Check files for increased error count
        run: npx ts-node currentBranch/scripts/checkAllFilesForTypeErrorCount.ts
